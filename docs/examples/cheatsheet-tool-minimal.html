<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 同一オリジンの読み込みだけを許可（GitHub Pages ではヘッダーを設定できないため meta で指定） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>チートシート作成ツール（連携サンプル）</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        color: #0f172a;
      }
      .item {
        margin: 8px 0;
        padding: 8px;
        border: 1px solid #e2e8f0;
        border-top: 2px solid var(--c, #1d4ed8);
      }
      pre {
        margin: 4px 0 0;
        white-space: pre-wrap;
      }
      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1 id="title">チートシート</h1>
    <div id="app"></div>
    <script>
      // ポータルとの連携サンプル（最小実装）。仕様: docs/cheatsheet-tool-integration.md
      const SCHEMA_VERSION = 1;
      const SLUG_PATTERN = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
      const COLOR_PATTERN = /^#[0-9a-f]{6}$/i;
      const LIMITS = { groups: 30, items: 300, text: 1000 };

      const app = document.getElementById('app');
      const showError = (message) => {
        const p = document.createElement('p');
        p.className = 'error';
        p.textContent = message;
        app.replaceChildren(p);
      };

      const isText = (v) => typeof v === 'string' && v.length <= LIMITS.text;

      /** 受け取ったJSONを検証する。想定外の形式は表示しない */
      const validate = (data, slug) => {
        if (!data || data.schemaVersion !== SCHEMA_VERSION) throw new Error('未対応のデータ形式です');
        const t = data.technology;
        if (!t || t.slug !== slug || !isText(t.name) || !COLOR_PATTERN.test(t.color))
          throw new Error('技術情報が不正です');
        if (!Array.isArray(data.groups) || data.groups.length > LIMITS.groups) throw new Error('グループ数が不正です');
        let count = 0;
        for (const g of data.groups) {
          if (!isText(g.title) || !Array.isArray(g.items)) throw new Error('グループが不正です');
          for (const i of g.items) {
            if (!isText(i.label) || !isText(i.code)) throw new Error('項目が不正です');
            count += 1;
          }
        }
        if (count > LIMITS.items) throw new Error('項目数が多すぎます');
        return data;
      };

      const render = (data) => {
        document.getElementById('title').textContent = `${data.technology.name} チートシート`;
        document.body.style.setProperty('--c', data.technology.color);
        const nodes = data.groups.flatMap((g) =>
          g.items.map((i) => {
            // textContent のみを使い、HTMLとして解釈させない
            const div = document.createElement('div');
            div.className = 'item';
            const label = document.createElement('strong');
            label.textContent = `${g.title} / ${i.label}`;
            const code = document.createElement('pre');
            code.textContent = i.code;
            div.append(label, code);
            return div;
          }),
        );
        app.replaceChildren(...nodes);
      };

      const main = async () => {
        const slug = new URLSearchParams(location.search).get('tech') ?? '';
        if (!SLUG_PATTERN.test(slug)) return showError('技術が指定されていません');
        // ツールは {サイト}/tools/cheatsheet/ に置く前提。データは {サイト}/data/cheatsheets/ の固定パスからのみ取得する
        const url = new URL(`../../data/cheatsheets/${slug}.json`, location.href);
        if (url.origin !== location.origin) return showError('取得先が不正です');
        const res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) return showError('チートシートが見つかりません');
        render(validate(await res.json(), slug));
      };

      main().catch((e) => showError(e instanceof Error ? e.message : '読み込みに失敗しました'));
    </script>
  </body>
</html>
